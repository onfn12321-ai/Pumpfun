services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pumpfun_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pumpfun_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pumpfun-postgres:/var/lib/postgresql/data

volumes:
  pumpfun-postgres:
